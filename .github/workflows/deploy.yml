# Deploys the site to Cloudflare Workers (Worker "sales-ops", Zid
# Holding account) on every push to main. Also runnable by hand from the
# Actions tab ("Run workflow"), which redeploys main.
#
# Repository secrets: CLOUDFLARE_API_TOKEN (Edit Cloudflare Workers) and
# CLOUDFLARE_ACCOUNT_ID. The account is also pinned in wrangler.jsonc,
# which takes precedence.
name: Deploy to Cloudflare Workers

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time, newest last, so an older commit can never finish
# after a newer one and roll the site back.
concurrency:
  group: cloudflare-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # A manual run started on another branch must not reach production.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22 # wrangler 4.151.0 needs Node 22+

      # Same command as a manual deploy (README). npx keeps Wrangler out of
      # the repo folder, which is also the folder being published.
      - name: Deploy
        run: npx --yes wrangler@4.151.0 deploy --message "${GITHUB_REPOSITORY}@${GITHUB_SHA::7}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
